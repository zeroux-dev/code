<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
  .font{font-family:Vazirmatn,Tahoma,'Segoe UI',Arial,sans-serif}
  @media (max-width:520px){.card{border-radius:0!important}.pad{padding:28px 22px!important}}
</style>
</head>
<body style="margin:0;padding:0;background:#0B0B14;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0B0B14;">
<tr><td align="center" style="padding:36px 12px;">
  <table role="presentation" class="card" width="520" cellpadding="0" cellspacing="0" style="width:100%;max-width:520px;background:#14141F;border:1px solid #2A2A3D;border-radius:24px;overflow:hidden;">
    <tr><td style="height:4px;background:#7C5CFF;background-image:linear-gradient(90deg,#7C5CFF,#FF4F9A);font-size:0;line-height:0">&nbsp;</td></tr>
    <tr><td class="pad font" style="padding:36px 40px 0;text-align:right;">
      <div class="font" style="font-size:22px;font-weight:800;color:#F5F5FA;direction:ltr;text-align:right">repol<span style="color:#FF4F9A">.</span></div>
      <h1 style="margin:22px 0 0;font-size:22px;line-height:1.8;color:#F5F5FA;font-weight:800">{{title}}</h1>
      <p style="margin:10px 0 0;font-size:15px;line-height:2.1;color:#A3A3BA;white-space:pre-line">{{body}}</p>
    </td></tr>
    <tr><td class="pad" style="padding:28px 40px 34px;text-align:right;">
      <a href="{{url}}" class="font" style="display:inline-block;background:#7C5CFF;background-image:linear-gradient(90deg,#7C5CFF,#FF4F9A);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 28px;border-radius:14px">{{cta}}</a>
    </td></tr>
    <tr><td class="font" style="padding:18px 40px;border-top:1px solid #2A2A3D;text-align:center;font-size:12px;color:#6B6B85;">
      ریپل · دایرکت هوشمند اینستاگرام &nbsp;|&nbsp; <a href="{{app_url}}" style="color:#B8A6FF;text-decoration:none">repol.ir</a> &nbsp;|&nbsp; {{year}}
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
